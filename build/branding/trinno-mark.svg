<?xml version="1.0" encoding="UTF-8"?>
<!--
  Trinno Research IDE — monochrome (T) mark for compact displays.
  Use in toolbar / status bar where the full color logo is too heavy.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trinno mark">
  <title>Trinno mark</title>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="currentColor"/>
  <rect x="14" y="16" width="36" height="6" rx="2" fill="#fff"/>
  <rect x="28" y="16" width="6"  height="34" rx="2" fill="#fff"/>
</svg>
