name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      skip_trinno_build:
        description: 'Skip trinno-research extension build'
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      TAG_NAME: v${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout tride
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install system tools (rsvg, libzip, jq, imagemagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick zip unzip jq

      # ----- trinno-research extension source -----
      - name: Locate trinno-research checkout
        id: trinno
        env:
          TRINNO_PATH: ${{ github.workspace }}/../trinno
        run: |
          if [ -d "${TRINNO_PATH}" ]; then
            echo "path=${TRINNO_PATH}" >> "$GITHUB_OUTPUT"
            echo "Found trinno at ${TRINNO_PATH}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Trinno not found locally; cloning..."
            cd ..
            git clone --depth 1 https://github.com/open1s/trinno.git trinno
            echo "path=$(pwd)/trinno" >> "$GITHUB_OUTPUT"
          fi

      - name: Build trinno-research
        if: ${{ inputs.skip_trinno_build != true }}
        working-directory: ${{ steps.trinno.outputs.path }}
        run: |
          npm ci || npm install
          npm run compile

      # ----- branding + extension bundling -----
      - name: Run prepare-trinno.sh
        env:
          TRINNO_PATH: ${{ steps.trinno.outputs.path }}
          SKIP_PREPARE_BRANDING: 'false'
        run: bash scripts/prepare-trinno.sh

      # ----- version bump -----
      - name: Bump versions
        run: |
          VERSION="${VERSION#v}"
          echo "Bumping to version ${VERSION}"
          jq --arg v "${VERSION}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          if [ -f product.json ]; then
            (jq --arg v "${VERSION}" 'has("version") | if . then .version = $v else . end' product.json > product.json.tmp) && mv product.json.tmp product.json || true
          fi

      # ----- collect assets -----
      - name: Collect release assets
        run: |
          mkdir -p .release/assets
          [ -f build/extensions/trinno-research.vsix ]    && cp build/extensions/trinno-research.vsix    .release/assets/ || echo "skip trinno-research.vsix"
          [ -f build/extensions/tinymist-universal.vsix ] && cp build/extensions/tinymist-universal.vsix .release/assets/ || echo "skip tinymist-universal.vsix"
          cp build/branding/trinno-logo-256.png .release/assets/trinno-icon-256.png
          cp package.json .release/
          cp product.json .release/
          echo "VERSION=${VERSION#v}" > .release/version
          ls -la .release/ .release/assets/

      # ----- changelog generation -----
      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
          {
            echo "## Tride ${VERSION#v}"
            echo ""
            echo "Pre-built distributions and bundled extensions for the Tride IDE."
            echo ""
            echo "### Bundled extensions"
            echo ""
            printf '%s\n' "- **open1s.trinno-research** $(printf '\xe2\x80\x94') TRIZ research assistant (chat panel, contradiction analysis, paper download, BOS agent)"
            printf '%s\n' "- **myriad-dreamin.tinymist** $(printf '\xe2\x80\x94') Typst language service (preview, formatting, LSP)"
            printf '%s\n' "- **vscode.mermaid-markdown-features** $(printf '\xe2\x80\x94') Mermaid diagram rendering in markdown preview"
            echo ""
            echo "### Assets"
            echo ""
            echo "| File | Description |"
            echo "|------|-------------|"
            echo "| \`trinno-research.vsix\` | Trinno Research extension VSIX |"
            echo "| \`tinymist-universal.vsix\` | Tinymist Typst extension VSIX |"
            printf '%s\n' "| \`trinno-icon-256.png\` | Brand icon (256x256) |"
            printf '%s\n' "| \`tride-linux-x64.tar.gz\` | Tride IDE for Linux x64 |"
            printf '%s\n' "| \`tride-darwin-x64.zip\` | Tride IDE for macOS x64 (Intel) |"
            printf '%s\n' "| \`tride-darwin-arm64.zip\` | Tride IDE for macOS arm64 (Apple Silicon) |"
            printf '%s\n' "| \`tride-win32-x64.zip\` | Tride IDE for Windows x64 |"
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              echo "### Changelog"
              echo ""
              echo "_Commits since \`${PREV_TAG}\`:_"
              echo ""
              echo '```'
              git log --pretty=format:"- %h %s" "${PREV_TAG}..HEAD" -- ':!.build' | head -50
              echo ""
              echo '```'
            fi
          } > .release/NOTES.md
          cat .release/NOTES.md

      # ----- tag check / creation -----
      - name: Ensure tag exists
        run: |
          if ! git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Creating tag ${TAG_NAME}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG_NAME}" -m "Tride ${VERSION#v}"
            git push origin "${TAG_NAME}" || echo "Tag push failed (may already exist)"
          else
            echo "Tag ${TAG_NAME} already exists"
          fi

      # ----- create release -----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: 'Tride ${{ env.VERSION }}'
          body_path: .release/NOTES.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            .release/assets/trinno-research.vsix
            .release/assets/tinymist-universal.vsix
            .release/assets/trinno-icon-256.png
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts for bundle job
        uses: actions/upload-artifact@v4
        with:
          name: tride-release-artifacts
          path: |
            .release/assets/
            .release/product.json
            .release/package.json
          if-no-files-found: error

  bundle-platforms:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      TAG_NAME: v${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: tride-release-artifacts
          path: .release/

      - name: Setup
        run: |
          mkdir -p .release_assets
          echo "VERSION=${VERSION#v}" > .release/.version

      - name: Bundle Linux x64
        run: |
          set -euxo pipefail
          TAG=$(curl -sL https://api.github.com/repos/VSCodium/vscodium/releases/latest | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['tag_name'])")
          echo "VSCodium tag: $TAG"
          URL="https://github.com/VSCodium/vscodium/releases/download/$TAG/VSCodium-linux-x64-$TAG.tar.gz"
          echo "Downloading $URL"
          curl -fL "$URL" -o vscodium-linux.tar.gz
          ls -lh vscodium-linux.tar.gz
          tar -xzf vscodium-linux.tar.gz
          echo "=== Contents after extraction ===" && ls -la
          DIR=$(find . -maxdepth 1 -mindepth 1 -type d | head -1)
          echo "Extracted dir: $DIR"
          test -n "$DIR"
          cp .release/product.json "$DIR/resources/app/product.json"
          mkdir -p "$DIR/resources/app/extensions"
          cp .release/assets/trinno-research.vsix "$DIR/resources/app/extensions/trinno-research.vsix" 2>/dev/null || true
          cp .release/assets/tinymist-universal.vsix "$DIR/resources/app/extensions/tinymist-universal.vsix" 2>/dev/null || true
          tar -czf .release_assets/tride-linux-x64.tar.gz "$DIR"

      - name: Bundle macOS x64
        run: |
          set -euxo pipefail
          TAG=$(curl -sL https://api.github.com/repos/VSCodium/vscodium/releases/latest | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['tag_name'])")
          URL="https://github.com/VSCodium/vscodium/releases/download/$TAG/VSCodium-darwin-x64-$TAG.zip"
          curl -fL "$URL" -o vscodium-darwin-x64.zip
          unzip -q vscodium-darwin-x64.zip
          echo "=== Contents ===" && ls -la
          APP_DIR=$(find . -maxdepth 2 -name '*.app' -type d | head -1 || ls -d VSCodium.app 2>/dev/null || echo "")
          test -n "$APP_DIR"
          cp .release/product.json "$APP_DIR/Contents/Resources/app/product.json"
          mkdir -p "$APP_DIR/Contents/Resources/app/extensions"
          cp .release/assets/trinno-research.vsix "$APP_DIR/Contents/Resources/app/extensions/" 2>/dev/null || true
          cp .release/assets/tinymist-universal.vsix "$APP_DIR/Contents/Resources/app/extensions/" 2>/dev/null || true
          zip -qr .release_assets/tride-darwin-x64.zip "$APP_DIR"
          ls -lh .release_assets/tride-darwin-x64.zip

      - name: Bundle macOS arm64
        run: |
          set -euxo pipefail
          TAG=$(curl -sL https://api.github.com/repos/VSCodium/vscodium/releases/latest | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['tag_name'])")
          URL="https://github.com/VSCodium/vscodium/releases/download/$TAG/VSCodium-darwin-arm64-$TAG.zip"
          curl -fL "$URL" -o vscodium-darwin-arm64.zip
          mkdir -p codium-arm64
          unzip -q vscodium-darwin-arm64.zip -d codium-arm64
          echo "=== Contents ===" && ls -la codium-arm64/
          APP_DIR=$(find codium-arm64 -maxdepth 2 -name '*.app' -type d | head -1)
          test -n "$APP_DIR"
          mv "$APP_DIR" codium-arm64/Tride-arm64.app
          APP_DIR="codium-arm64/Tride-arm64.app"
          cp .release/product.json "$APP_DIR/Contents/Resources/app/product.json"
          mkdir -p "$APP_DIR/Contents/Resources/app/extensions"
          cp .release/assets/trinno-research.vsix "$APP_DIR/Contents/Resources/app/extensions/" 2>/dev/null || true
          cp .release/assets/tinymist-universal.vsix "$APP_DIR/Contents/Resources/app/extensions/" 2>/dev/null || true
          cd codium-arm64 && zip -qr "$GITHUB_WORKSPACE/.release_assets/tride-darwin-arm64.zip" "$(basename "$APP_DIR")" && cd "$GITHUB_WORKSPACE"
          ls -lh .release_assets/tride-darwin-arm64.zip

      - name: Bundle Windows x64
        run: |
          set -euxo pipefail
          TAG=$(curl -sL https://api.github.com/repos/VSCodium/vscodium/releases/latest | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['tag_name'])")
          URL="https://github.com/VSCodium/vscodium/releases/download/$TAG/VSCodium-win32-x64-$TAG.zip"
          curl -fL "$URL" -o vscodium-win32-x64.zip
          unzip -q vscodium-win32-x64.zip
          echo "=== Contents ===" && ls -la
          DIR=$(find . -maxdepth 1 -mindepth 1 -type d | head -1)
          test -n "$DIR"
          cp .release/product.json "$DIR/resources/app/product.json"
          mkdir -p "$DIR/resources/app/extensions"
          cp .release/assets/trinno-research.vsix "$DIR/resources/app/extensions/" 2>/dev/null || true
          cp .release/assets/tinymist-universal.vsix "$DIR/resources/app/extensions/" 2>/dev/null || true
          zip -qr .release_assets/tride-win32-x64.zip "$DIR"
          ls -lh .release_assets/tride-win32-x64.zip

      - name: Upload platform assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            .release_assets/tride-linux-x64.tar.gz
            .release_assets/tride-darwin-x64.zip
            .release_assets/tride-darwin-arm64.zip
            .release_assets/tride-win32-x64.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

