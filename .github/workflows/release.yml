name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      skip_trinno_build:
        description: 'Skip trinno-research extension build'
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      TAG_NAME: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
    steps:
      - name: Checkout tride
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install system tools (rsvg, libzip, jq, imagemagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick zip unzip jq

      # ----- trinno-research extension source -----
      - name: Locate trinno-research checkout
        id: trinno
        env:
          TRINNO_PATH: ${{ github.workspace }}/../trinno
        run: |
          if [ -d "${TRINNO_PATH}" ]; then
            echo "path=${TRINNO_PATH}" >> "$GITHUB_OUTPUT"
            echo "Found trinno at ${TRINNO_PATH}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Trinno not found locally; cloning..."
            cd ..
            git clone --depth 1 https://github.com/open1s/trinno.git trinno
            echo "path=$(pwd)/trinno" >> "$GITHUB_OUTPUT"
          fi

      - name: Build trinno-research
        if: ${{ inputs.skip_trinno_build != true }}
        working-directory: ${{ steps.trinno.outputs.path }}
        run: |
          npm ci || npm install
          npm run compile

      # ----- branding + extension bundling -----
      - name: Run prepare-trinno.sh
        env:
          TRINNO_PATH: ${{ steps.trinno.outputs.path }}
          SKIP_PREPARE_BRANDING: 'false'
        run: bash scripts/prepare-trinno.sh

      # ----- version bump -----
      - name: Bump versions
        run: |
          VERSION="${VERSION#v}"
          echo "Bumping to version ${VERSION}"
          jq --arg v "${VERSION}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          if [ -f product.json ]; then
            jq --arg v "${VERSION}" '.version = $v' product.json > product.json.tmp && mv product.json.tmp product.json
          fi

      # ----- collect assets -----
      - name: Collect release assets
        run: |
          mkdir -p .release/assets
          [ -f build/extensions/trinno-research.vsix ]    && cp build/extensions/trinno-research.vsix    .release/assets/ || echo "skip trinno-research.vsix"
          [ -f build/extensions/tinymist-universal.vsix ] && cp build/extensions/tinymist-universal.vsix .release/assets/ || echo "skip tinymist-universal.vsix"
          cp build/branding/trinno-logo-256.png .release/assets/trinno-icon-256.png
          cp package.json .release/
          cp product.json .release/
          echo "VERSION=${VERSION#v}" > .release/version
          ls -la .release/ .release/assets/

      # ----- changelog generation -----
      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
          {
            echo "## Tride ${VERSION#v}"
            echo ""
            echo "Pre-built distributions and bundled extensions for the Tride IDE."
            echo ""
            echo "### Bundled extensions"
            echo ""
            printf '%s\n' "- **open1s.trinno-research** $(printf '\xe2\x80\x94') TRIZ research assistant (chat panel, contradiction analysis, paper download, BOS agent)"
            printf '%s\n' "- **myriad-dreamin.tinymist** $(printf '\xe2\x80\x94') Typst language service (preview, formatting, LSP)"
            printf '%s\n' "- **vscode.mermaid-markdown-features** $(printf '\xe2\x80\x94') Mermaid diagram rendering in markdown preview"
            echo ""
            echo "### Assets"
            echo ""
            echo "| File | Description |"
            echo "|------|-------------|"
            echo "| \`trinno-research.vsix\` | Trinno Research extension VSIX |"
            echo "| \`tinymist-universal.vsix\` | Tinymist Typst extension VSIX |"
            printf '%s\n' "| \`trinno-icon-256.png\` | Brand icon (256x256) |"
            printf '%s\n' "| \`tride-linux-x64.tar.gz\` | Tride IDE for Linux x64 |"
            printf '%s\n' "| \`tride-darwin-x64.zip\` | Tride IDE for macOS x64 (Intel) |"
            printf '%s\n' "| \`tride-darwin-arm64.zip\` | Tride IDE for macOS arm64 (Apple Silicon) |"
            printf '%s\n' "| \`tride-win32-x64.zip\` | Tride IDE for Windows x64 |"
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              echo "### Changelog"
              echo ""
              echo "_Commits since \`${PREV_TAG}\`:_"
              echo ""
              echo '```'
              git log --pretty=format:"- %h %s" "${PREV_TAG}..HEAD" -- ':!.build' | head -50
              echo ""
              echo '```'
            fi
          } > .release/NOTES.md
          cat .release/NOTES.md

      # ----- tag check / creation -----
      - name: Ensure tag exists
        run: |
          if ! git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Creating tag ${TAG_NAME}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG_NAME}" -m "Tride ${VERSION#v}"
            git push origin "${TAG_NAME}" || echo "Tag push failed (may already exist)"
          else
            echo "Tag ${TAG_NAME} already exists"
          fi

      # ----- create release -----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: 'Tride ${{ env.VERSION }}'
          body_path: .release/NOTES.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            .release/assets/trinno-research.vsix
            .release/assets/tinymist-universal.vsix
            .release/assets/trinno-icon-256.png
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts for build jobs
        uses: actions/upload-artifact@v4
        with:
          name: tride-release-artifacts
          path: |
            .release/assets/
            .release/product.json
            .release/package.json
            build/extensions/*.vsix
            build/extensions/
          if-no-files-found: error

  build-platforms:
    needs: release
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: tride-linux-x64.tar.gz
            pack: tar -czf
            pack_extras: ""
            sysdeps: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev libxss-dev libasound2-dev libxkbfile-dev libkrb5-dev

          - name: darwin-x64
            os: macos-13
            platform: darwin
            arch: x64
            artifact: tride-darwin-x64.zip
            pack: zip -qr
            pack_extras: ""
            sysdeps: ""

          - name: darwin-arm64
            os: macos-14
            platform: darwin
            arch: arm64
            artifact: tride-darwin-arm64.zip
            pack: zip -qr
            pack_extras: ""
            sysdeps: ""

          - name: win32-x64
            os: windows-latest
            platform: win32
            arch: x64
            artifact: tride-win32-x64.zip
            pack: 7z a -tzip
            pack_extras: ""
            sysdeps: ""

    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      TAG_NAME: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install system dependencies
        if: matrix.sysdeps != ''
        run: ${{ matrix.sysdeps }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: tride-release-artifacts
          path: .release-artifacts/

      - name: Apply Tride branding
        shell: bash
        run: |
          cp .release-artifacts/.release/product.json product.json
          cp .release-artifacts/.release/package.json package.json
          mkdir -p build/extensions
          cp .release-artifacts/build/extensions/*.vsix build/extensions/ 2>/dev/null || true
          bash scripts/install-branding.sh || true

          python3 -c "import json; p=json.load(open('product.json')); assert isinstance(p, dict) and 'builtInExtensions' in p; print('product.json validated OK')"

      - name: Install dependencies (non-Windows)
        if: matrix.name != 'win32-x64'
        env:
          npm_config_build_from_source: "false"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm ci

      - name: Install dependencies (Windows)
        if: matrix.name == 'win32-x64'
        env:
          npm_config_build_from_source: "false"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm ci --ignore-scripts
          node build/npm/postinstall.ts

      - name: Compile
        run: npm run gulp core-ci

      - name: Package copilot extension
        run: npm run gulp compile-copilot-extension-build

      - name: Package (${{ matrix.name }})
        run: npm run gulp vscode-${{ matrix.platform }}-${{ matrix.arch }}-min-ci

      - name: Create archive
        run: |
          mkdir -p .release_assets
          cd "$GITHUB_WORKSPACE/.."
          ${{ matrix.pack }} "$GITHUB_WORKSPACE/.release_assets/${{ matrix.artifact }}" VSCode-${{ matrix.platform }}-${{ matrix.arch }}/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: .release_assets/${{ matrix.artifact }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

