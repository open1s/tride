name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      skip_trinno_build:
        description: 'Skip trinno-research extension build'
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    needs: build-linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      TAG_NAME: v${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout tride
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: tride-linux-x64
          path: .release/assets/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install system tools (rsvg, libzip, jq, imagemagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick zip unzip jq

      # ----- trinno-research extension source -----
      - name: Locate trinno-research checkout
        id: trinno
        env:
          TRINNO_PATH: ${{ github.workspace }}/../trinno
        run: |
          if [ -d "${TRINNO_PATH}" ]; then
            echo "path=${TRINNO_PATH}" >> "$GITHUB_OUTPUT"
            echo "Found trinno at ${TRINNO_PATH}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Trinno not found locally; cloning..."
            cd ..
            git clone --depth 1 https://github.com/open1s/trinno.git trinno
            echo "path=$(pwd)/trinno" >> "$GITHUB_OUTPUT"
          fi

      - name: Build trinno-research
        if: ${{ inputs.skip_trinno_build != true }}
        working-directory: ${{ steps.trinno.outputs.path }}
        run: |
          npm ci || npm install
          npm run compile

      # ----- branding + extension bundling -----
      - name: Run prepare-trinno.sh
        env:
          TRINNO_PATH: ${{ steps.trinno.outputs.path }}
          SKIP_PREPARE_BRANDING: 'false'
        run: bash scripts/prepare-trinno.sh

      # ----- version bump -----
      - name: Bump versions
        run: |
          VERSION="${VERSION#v}"
          echo "Bumping to version ${VERSION}"
          jq --arg v "${VERSION}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          if [ -f product.json ]; then
            (jq --arg v "${VERSION}" 'has("version") | if . then .version = $v else . end' product.json > product.json.tmp) && mv product.json.tmp product.json || true
          fi

      # ----- collect assets -----
      - name: Collect release assets
        run: |
          mkdir -p .release/assets
          [ -f build/extensions/trinno-research.vsix ]    && cp build/extensions/trinno-research.vsix    .release/assets/ || echo "skip trinno-research.vsix"
          [ -f build/extensions/tinymist-universal.vsix ] && cp build/extensions/tinymist-universal.vsix .release/assets/ || echo "skip tinymist-universal.vsix"
          cp build/branding/trinno-logo-256.png .release/assets/trinno-icon-256.png
          cp package.json .release/
          cp product.json .release/
          echo "VERSION=${VERSION#v}" > .release/version
          ls -la .release/ .release/assets/

      # ----- changelog generation -----
      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
          {
            echo "## Tride ${VERSION#v}"
            echo ""
            echo "Pre-built distributions and bundled extensions for the Tride IDE."
            echo ""
            echo "### Bundled extensions"
            echo ""
            printf '%s\n' "- **open1s.trinno-research** $(printf '\xe2\x80\x94') TRIZ research assistant (chat panel, contradiction analysis, paper download, BOS agent)"
            printf '%s\n' "- **myriad-dreamin.tinymist** $(printf '\xe2\x80\x94') Typst language service (preview, formatting, LSP)"
            printf '%s\n' "- **vscode.mermaid-markdown-features** $(printf '\xe2\x80\x94') Mermaid diagram rendering in markdown preview"
            echo ""
            echo "### Assets"
            echo ""
            echo "| File | Description |"
            echo "|------|-------------|"
            echo "| \`trinno-research.vsix\` | Trinno Research extension VSIX |"
            echo "| \`tinymist-universal.vsix\` | Tinymist Typst extension VSIX |"
            printf '%s\n' "| \`trinno-icon-256.png\` | Brand icon (256x256) |"
            printf '%s\n' "| \`tride-linux-x64.tar.gz\` | Tride IDE for Linux x64 (unsigned) |"
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              echo "### Changelog"
              echo ""
              echo "_Commits since \`${PREV_TAG}\`:_"
              echo ""
              echo '```'
              git log --pretty=format:"- %h %s" "${PREV_TAG}..HEAD" -- ':!.build' | head -50
              echo ""
              echo '```'
            fi
          } > .release/NOTES.md
          cat .release/NOTES.md

      # ----- tag check / creation -----
      - name: Ensure tag exists
        run: |
          if ! git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Creating tag ${TAG_NAME}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG_NAME}" -m "Tride ${VERSION#v}"
            git push origin "${TAG_NAME}" || echo "Tag push failed (may already exist)"
          else
            echo "Tag ${TAG_NAME} already exists"
          fi

      # ----- create release -----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: 'Tride ${{ env.VERSION }}'
          body_path: .release/NOTES.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            .release/assets/trinno-research.vsix
            .release/assets/tinymist-universal.vsix
            .release/assets/trinno-icon-256.png
            .release/assets/tride-linux-x64.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout tride
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.version && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            build/node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nm-

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config xvfb libgtk-3-0 libxkbfile-dev libkrb5-dev libgbm1 \
            rpm bubblewrap socat fakeroot dpkg-dev

      - name: Install npm deps
        run: |
          npm ci || npm install

      - name: Build Tride Linux x64
        env:
          VSCODE_QUALITY: 'oss'
          VSCODE_BUILD_LINUX_SNAP: 'false'
        run: |
          set -e
          yarn run gulp vscode-linux-x64-min || yarn run gulp vscode-linux-x64
          ls -la .build/linux 2>/dev/null || true
          find .build -maxdepth 3 -iname '*linux*' -o -iname 'VSCode*' | head -30

      - name: Package tride-linux-x64.tar.gz
        run: |
          set -e
          mkdir -p .release_linux/assets
          UNSIGNED=$(find .build/linux -maxdepth 2 -type d -name 'VSCode-linux-x64' | head -1)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find .build -maxdepth 4 -type d -name 'VSCode-linux-x64' | head -1)
          fi
          if [ -z "$UNSIGNED" ]; then
            echo "::error::VSCode-linux-x64 build output not found under .build/"
            find .build -maxdepth 4 -type d | head -50
            exit 1
          fi
          echo "Found build at: $UNSIGNED"
          cd "$(dirname "$UNSIGNED")"
          tar -czf "$GITHUB_WORKSPACE/.release_linux/assets/tride-linux-x64.tar.gz" "$(basename "$UNSIGNED")"
          ls -la "$GITHUB_WORKSPACE/.release_linux/assets/"

      - name: Upload linux-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tride-linux-x64
          path: .release_linux/assets/tride-linux-x64.tar.gz
          if-no-files-found: error
